services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your .env file — see .env.example}
      # Optional — see .env.example for what each of these does. Fine to leave unset.
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
      BEHIND_PROXY: ${BEHIND_PROXY:-1}
      COOKIE_INSECURE: ${COOKIE_INSECURE:-0}
      # Defaults to a SQLite file under ./data/instance. To use Postgres instead,
      # set DATABASE_URL in your .env (see the commented `db` service below) —
      # nothing else needs to change, psycopg2 is already installed.
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/instance/app.db}
    volumes:
      # Bind-mounted (not named volumes) so the database and uploaded files are easy
      # to find, back up, or sync to your NAS — everything lives under ./data.
      - ./data/instance:/app/instance
      - ./data/uploads:/app/app/uploads
      - ./data/static_uploads:/app/app/static/uploads

  # --- Optional: switch to Postgres instead of SQLite -------------------------------
  # Uncomment this service, set DATABASE_URL in .env to:
  #   postgresql://3dpms:CHANGE_ME@db:5432/3dpms
  # and add `depends_on: [db]` under the `web` service above.
  #
  # db:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: 3dpms
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
  #     POSTGRES_DB: 3dpms
  #   volumes:
  #     - ./data/postgres:/var/lib/postgresql/data
