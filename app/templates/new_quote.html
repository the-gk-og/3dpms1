{% extends 'base.html' %}
{% block page_title %}Create Quote{% endblock %}
{% block content %}
<div style="max-width: 780px;">
  <div class="page-header">
    <h2>New Quote</h2>
  </div>

  <form method="post" class="panel">
    <div class="form-section" style="margin-top: 0; padding-top: 0; border: none;">
      <h3>Client</h3>
      <label>Existing Client
        <select name="client_id" id="client_select">
          <option value="">Create new client...</option>
          {% for client in clients %}
          <option value="{{ client.id }}">{{ client.name }}{% if client.email %} — {{ client.email }}{% endif %}</option>
          {% endfor %}
        </select>
      </label>
      <div id="new-client-fields" style="display: none;">
        <div class="form-grid-2">
          <label>Client Name<input type="text" name="client_name" id="client_name" placeholder="John Smith"></label>
          <label>Phone<input type="text" name="client_phone" placeholder="+61 400 000 000"></label>
        </div>
        <label>Email<input type="email" name="client_email" placeholder="client@example.com"></label>
      </div>
    </div>

    <div class="form-section">
      <h3>Quote Settings</h3>
      <label>Surcharge %<input type="number" step="0.01" name="surcharge_percent" value="0"></label>
      <label style="font-weight: 600;">Payment Methods Accepted</label>
      <div class="checkbox-grid">
        <label class="checkbox-item"><input type="checkbox" name="payment_bank_transfer" checked> Bank Transfer</label>
        <label class="checkbox-item"><input type="checkbox" name="payment_pay_id"> Pay ID</label>
        <label class="checkbox-item"><input type="checkbox" name="payment_cash"> Cash</label>
        <label class="checkbox-item"><input type="checkbox" name="payment_eft"> EFT</label>
        <label class="checkbox-item"><input type="checkbox" name="payment_credit_card"> Credit Card</label>
        <label class="checkbox-item"><input type="checkbox" name="payment_stripe"> Stripe</label>
      </div>
      <label>Notes<textarea name="notes" rows="3" placeholder="Project details, delivery info..."></textarea></label>
      <label class="checkbox-item" style="background: transparent; padding: 0;">
        <input type="checkbox" name="digital_signature_enabled"> Include signature area on PDF
      </label>
    </div>

    <div style="display: flex; gap: 0.75rem;">
      <button type="submit" style="flex: 1;">Create Quote</button>
      <a href="{{ url_for('main.quotes') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('client_select').addEventListener('change', function() {
  const fields = document.getElementById('new-client-fields');
  const nameInput = document.getElementById('client_name');
  if (this.value === '') {
    fields.style.display = 'block';
    nameInput.required = true;
  } else {
    fields.style.display = 'none';
    nameInput.required = false;
  }
});
</script>
{% endblock %}
