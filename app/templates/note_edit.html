<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ label }} — 3DPMS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/font-awesome/css/font-awesome.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/easymde/easymde.min.css') }}">
  <style>
    /* Deliberately plain — this mirrors the stock EasyMDE demo chrome rather
       than the app's own theme, since this page is meant to feel like a
       distraction-free popout editor, not another app screen. */
    html, body { height: 100%; margin: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .container { max-width: 1000px; margin: 0 auto; padding: 1.5rem 1rem; }
    .container h1 { font-size: 1.1rem; margin: 0 0 0.75rem; }
    .container h1 a { font-size: 0.85rem; font-weight: normal; color: #777; text-decoration: none; margin-left: 0.75rem; }
    .container h1 a:hover { text-decoration: underline; }
    .lock-note { font-size: 0.8rem; color: #b8860b; font-weight: normal; margin-left: 0.5rem; }
    #status { font-size: 0.8rem; color: #888; margin-top: 0.4rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>{{ label }}{% if not client_visible %}<span class="lock-note">&#128274; staff only</span>{% endif %}<a href="{{ back_url }}">&larr; back</a></h1>
    <textarea id="note-editor"></textarea>
    <div id="status">Ctrl/Cmd+S to save</div>
  </div>

  <script src="{{ url_for('static', filename='vendor/easymde/easymde.min.js') }}"></script>
  <script>
    (function () {
      var initialValue = {{ content|tojson }};
      var csrfToken = {{ csrf_token()|tojson }};
      var saveUrl = {{ save_url|tojson }};
      var statusEl = document.getElementById('status');
      var dirty = false;
      var lastSaved = initialValue;

      function save() {
        var value = easyMDE.value();
        statusEl.textContent = 'Saving…';
        fetch(saveUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
          body: JSON.stringify({ content: value }),
        })
          .then(function (res) {
            if (!res.ok) throw new Error('save failed (' + res.status + ')');
            return res.json();
          })
          .then(function () {
            lastSaved = value;
            dirty = false;
            statusEl.textContent = 'Saved ' + new Date().toLocaleTimeString();
          })
          .catch(function () {
            statusEl.textContent = 'Save failed — check your connection and retry';
          });
      }

      var easyMDE = new EasyMDE({
        element: document.getElementById('note-editor'),
        initialValue: initialValue,
        autofocus: true,
        spellChecker: true,
        // singleLineBreaks matches the server's `nl2br` Markdown extension
        // (helpers.py render_markdown) so the preview here matches what's
        // actually saved and rendered elsewhere in the app.
        renderingConfig: { singleLineBreaks: true, codeSyntaxHighlighting: false },
        toolbar: [
          'bold', 'italic', 'heading', '|',
          'quote', 'unordered-list', 'ordered-list', '|',
          'link', 'image', 'table', '|',
          'preview', 'side-by-side', 'fullscreen', '|',
          {
            name: 'save',
            action: save,
            className: 'fa fa-floppy-o',
            title: 'Save (Ctrl/Cmd+S)',
          },
          'guide',
        ],
      });

      // Open straight into live side-by-side preview.
      easyMDE.toggleSideBySide();

      easyMDE.codemirror.on('change', function () {
        dirty = easyMDE.value() !== lastSaved;
        statusEl.textContent = dirty ? 'Unsaved changes' : 'Ctrl/Cmd+S to save';
      });

      var extraKeys = easyMDE.codemirror.getOption('extraKeys') || {};
      extraKeys['Cmd-S'] = function () { save(); return false; };
      extraKeys['Ctrl-S'] = function () { save(); return false; };
      easyMDE.codemirror.setOption('extraKeys', extraKeys);

      window.addEventListener('beforeunload', function (e) {
        if (!dirty) return;
        e.preventDefault();
        e.returnValue = '';
      });
    })();
  </script>
</body>
</html>
