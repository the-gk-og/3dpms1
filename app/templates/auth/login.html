{% extends 'base.html' %}
{% block page_title %}Sign In{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1 style="text-align: center; margin-top: 0;">Sign In</h1>
  <p style="text-align: center; color: var(--text-muted);">Access your 3D printing business workspace.</p>
  <form method="post">
    <label>Username
      <input type="text" name="username" required>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button type="submit" style="width: 100%;">Login</button>
  </form>
  <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-top: 1.5rem;">
    Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: var(--accent); text-decoration: none;">Create one</a>
  </p>
</div>
{% endblock %}
