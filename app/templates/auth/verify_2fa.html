{% extends 'base.html' %}
{% block page_title %}Verify — 2FA{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1 style="text-align: center; margin-top: 0;">Two-Factor Verification</h1>
  <p style="text-align: center; color: var(--text-muted);">
    Enter the 6-digit code from your authenticator app.
  </p>
  <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Code
      <input type="text" name="code" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="6" required autofocus>
    </label>
    <button type="submit" style="width: 100%;">Verify</button>
  </form>
</div>
{% endblock %}
