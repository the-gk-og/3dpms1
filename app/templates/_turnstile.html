{% macro turnstile_script(business) %}
{% if business.turnstile_site_key %}
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
{% endif %}
{% endmacro %}

{% macro turnstile_widget(business) %}
{% if business.turnstile_site_key %}
<div class="cf-turnstile" data-sitekey="{{ business.turnstile_site_key }}"></div>
{% endif %}
{% endmacro %}
